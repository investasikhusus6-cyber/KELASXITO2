<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri — Kelas XI TO 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="assets/logo.png" alt="Logo XI TO 2"> XI TO <span>2</span></a>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Beranda</a>
    <a href="jadwal.html">Jadwal</a>
    <a href="materi.html">Materi</a>
    <a href="tugas.html">Tugas</a>
    <a href="prestasi.html">Prestasi</a>
    <a href="pengumuman.html">Pengumuman</a>
    <a href="galeri.html" class="active">Galeri</a>
    <a href="kontak.html">Kontak</a>
  </div>
  <button class="burger" onclick="document.getElementById('navLinks').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <div class="page-inner">
    <div class="section-title">
      <div class="tag">DOKUMENTASI</div>
      <h2>Galeri Kegiatan</h2>
      <p>Klik foto untuk melihat versi besar.</p>
    </div>
    <div class="photo-grid" id="galeriGrid">
      <div class="photo-thumb" style="cursor:default;"><div class="photo-caption">Memuat data…</div></div>
    </div>
  </div>
</main>

<footer>
  <div class="logo"><img src="assets/logo.png" alt="Logo XI TO 2"> XI TO <span>2</span></div>
  <p>© 2026 Kelas XI TO 2 — Semester 1 — Dibuat untuk kebutuhan informasi internal kelas.</p>
</footer>

<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div class="lightbox-content">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script>
  function openLightbox(src, caption) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightboxCaption').textContent = caption || '';
    document.getElementById('lightboxOverlay').classList.add('active');
  }
  function closeLightbox() { document.getElementById('lightboxOverlay').classList.remove('active'); }
  document.getElementById('lightboxOverlay').addEventListener('click', e => {
    if (e.target.id === 'lightboxOverlay') closeLightbox();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  async function loadGaleri() {
    const container = document.getElementById('galeriGrid');
    try {
      const res = await fetch('data/galeri.json?_=' + Date.now());
      const items = await res.json();
      if (!items.length) {
        container.innerHTML = '<div class="photo-thumb" style="cursor:default;"><div class="photo-caption">Belum ada foto.</div></div>';
        return;
      }
      container.innerHTML = items.map((it, i) => `
        <div class="photo-thumb" data-idx="${i}">
          <img src="${it.img}" alt="${it.caption || ''}">
          <div class="photo-zoom-icon">🔍</div>
          <div class="photo-caption">${it.caption || ''}</div>
        </div>
      `).join('');
      container.querySelectorAll('.photo-thumb').forEach(el => {
        el.addEventListener('click', () => {
          const it = items[el.dataset.idx];
          openLightbox(it.img, it.caption);
        });
      });
    } catch (e) {
      container.innerHTML = '<div class="photo-thumb" style="cursor:default;"><div class="photo-caption">Gagal memuat galeri.</div></div>';
    }
  }
  loadGaleri();
</script>

</body>
</html>
