<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi — Kelas XI TO 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html"><img src="assets/logo.png" alt="Logo XI TO 2"> XI TO <span>2</span></a>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Beranda</a>
    <a href="jadwal.html">Jadwal</a>
    <a href="materi.html" class="active">Materi</a>
    <a href="tugas.html">Tugas</a>
    <a href="prestasi.html">Prestasi</a>
    <a href="pengumuman.html">Pengumuman</a>
    <a href="galeri.html">Galeri</a>
    <a href="kontak.html">Kontak</a>
  </div>
  <button class="burger" onclick="document.getElementById('navLinks').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <div class="page-inner">
    <div class="section-title">
      <div class="tag">MATERI PELAJARAN</div>
      <h2>Bahan Ajar Kelas</h2>
      <p>Klik salah satu file untuk melihat keterangan materi.</p>
    </div>
    <div class="file-list" id="materiList">
      <div class="file-row" style="cursor:default;"><div class="file-info"><p>Memuat data…</p></div></div>
    </div>
  </div>
</main>

<footer>
  <div class="logo"><img src="assets/logo.png" alt="Logo XI TO 2"> XI TO <span>2</span></div>
  <p>© 2026 Kelas XI TO 2 — Semester 1 — Dibuat untuk kebutuhan informasi internal kelas.</p>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="tag" id="modalTag" style="display:none;"></div>
    <h3 id="modalTitle"></h3>
    <p id="modalBody"></p>
  </div>
</div>

<script>
  function openModal(title, body, tagText) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = body;
    const tagEl = document.getElementById('modalTag');
    if (tagText) { tagEl.textContent = tagText; tagEl.style.display = 'inline-block'; }
    else { tagEl.style.display = 'none'; }
    document.getElementById('modalOverlay').classList.add('active');
  }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });

  async function loadMateri() {
    const container = document.getElementById('materiList');
    try {
      const res = await fetch('data/materi.json?_=' + Date.now());
      const items = await res.json();
      if (!items.length) {
        container.innerHTML = '<div class="file-row" style="cursor:default;"><div class="file-info"><p>Belum ada materi.</p></div></div>';
        return;
      }
      container.innerHTML = items.map((it, i) => `
        <button class="file-row" data-idx="${i}">
          <div class="file-icon">${it.icon || '📄'}</div>
          <div class="file-info">
            <h4>${it.title}</h4>
            <p>${it.subtitle || ''}</p>
          </div>
          <div class="file-meta">${it.meta || 'FILE'}</div>
          <div class="chevron">›</div>
        </button>
      `).join('');
      container.querySelectorAll('.file-row').forEach(row => {
        row.addEventListener('click', () => {
          const it = items[row.dataset.idx];
          if (it.fileUrl) {
            window.open(it.fileUrl, '_blank');
          } else {
            openModal(it.title, (it.subtitle ? it.subtitle + ' — ' : '') + 'Belum ada file terlampir.', it.meta);
          }
        });
      });
    } catch (e) {
      container.innerHTML = '<div class="file-row" style="cursor:default;"><div class="file-info"><p>Gagal memuat data materi.</p></div></div>';
    }
  }
  loadMateri();
</script>

</body>
</html>
